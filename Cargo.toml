[package]
name = "swifttray"
version = "1.0.1"
edition = "2021"
authors = ["SwiftTray"]
description = "A lightweight native Windows 11 audio flyout"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "UI_ViewManagement",
] }

[build-dependencies]
winres = "0.1.12"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[package.metadata]
# Works on Windows 11 (x64 and ARM64 if corresponding Rust toolchain is installed).
