name: SwiftTray Windows release

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    env:
      # Bundle the MSVC C runtime. Windows system DLLs remain OS dependencies.
      RUSTFLAGS: -C target-feature=+crt-static
      # Embed the checked-out repository (owner/name) for manual update checks.
      SWIFTTRAY_GITHUB_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Test Rust code
        run: cargo test --release --target x86_64-pc-windows-msvc
      - name: Build portable SwiftTray.exe
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Stage executable and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/swifttray.exe release/SwiftTray.exe
          $hash = (Get-FileHash release/SwiftTray.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SwiftTray.exe" | Set-Content release/SwiftTray.sha256 -Encoding ascii
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: SwiftTray-Windows-x64
          path: release/*
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: windows-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SwiftTray-Windows-x64
          path: release
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/SwiftTray.exe
            release/SwiftTray.sha256
          generate_release_notes: true
